name: Build Native Android APK

on:
  push:
    branches:
      - main
      - tour-web-app
      - staging
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Generate fixed debug.keystore & Log SHA-1
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -keystore android/app/debug.keystore -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "=================================================="
          echo "=== SHA-1 FINGERPRINT OF YOUR APK KEYSTORE ==="
          keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -i "SHA1:"
          echo "=================================================="

      - name: Build Android APK (Debug & Minified)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK File for Release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TourManager-v1.0.${{ github.run_number }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TourManager-v1.0.${{ github.run_number }}
          path: TourManager-v1.0.${{ github.run_number }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v1.0.${{ github.run_number }}
          name: "Tour Manager Android App v1.0.${{ github.run_number }}"
          body: "🌴 **Tour Manager Android Application (APK)**\n\n- Download `TourManager-v1.0.${{ github.run_number }}.apk` below and install directly on your Android mobile device!\n- Features: Offline Group Expense Tracker, Equal Settlement Ledger, PDF Statement Downloads, and Backup Restore."
          files: TourManager-v1.0.${{ github.run_number }}.apk
          make_latest: true
          target_commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
